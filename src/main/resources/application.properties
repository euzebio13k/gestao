###### Configuração BANCO DE DADOS MYSQL
# URL de conexão (substitua 'nome_do_banco' pelo nome do seu banco de dados no MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/gestao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuário e senha do seu MySQL local
spring.datasource.username=root
spring.datasource.password=123

# Driver do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate (cria/atualiza as tabelas automaticamente no banco)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect